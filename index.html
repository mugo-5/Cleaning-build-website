<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a2744">
  <title>Kim's Sparkle Cleaning Enterprise</title>
</head>
<body>
  <p id="status">Loading Kim's Sparkle Cleaning Enterprise…</p>
  <script>
    (async function () {
      const pagePath = 'Kims%20Sparkle%20Cleaning%20Business%20(5).html';
      try {
        const response = await fetch(pagePath, { cache: 'no-store' });
        if (!response.ok) throw new Error('The website page could not be loaded.');

        const page = await response.text();
        if (!page.includes('</body>')) throw new Error('The website page is incomplete.');

        document.open();
        document.write(page);
        document.close();

        const formScript = document.createElement('script');
        formScript.src = 'quote-form.js';
        formScript.async = false;
        document.body.appendChild(formScript);
      } catch (error) {
        const status = document.getElementById('status');
        if (status) status.textContent = 'The website could not be loaded. Please try again later.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
